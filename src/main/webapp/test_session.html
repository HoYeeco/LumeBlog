<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试SessionStorage</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.21.1/dist/axios.min.js"></script>
</head>
<body>
    <div id="app">
        <h1>SessionStorage测试</h1>
        <h2>登录测试</h2>
        <form @submit.prevent="login">
            <div>
                <label for="username">用户名：</label>
                <input type="text" id="username" v-model="loginForm.username" required>
            </div>
            <div>
                <label for="password">密码：</label>
                <input type="password" id="password" v-model="loginForm.password" required>
            </div>
            <button type="submit">登录</button>
        </form>
        
        <h2>SessionStorage内容</h2>
        <pre>{{ sessionStorageContent }}</pre>
        
        <h2>解析后的用户信息</h2>
        <pre>{{ parsedUserInfo }}</pre>
        
        <h2>Nickname测试</h2>
        <p v-if="parsedUser">欢迎，{{ parsedUser.nickname }}</p>
        <p v-else>未登录或用户信息无效</p>
    </div>
    
    <script>
        // 设置Axios默认配置
        axios.defaults.baseURL = '/LumeBlog';
        axios.defaults.headers.post['Content-Type'] = 'application/json';
        
        const app = new Vue({
            el: '#app',
            data: {
                loginForm: {
                    username: '',
                    password: ''
                },
                sessionStorageContent: '',
                parsedUserInfo: '',
                parsedUser: null
            },
            mounted() {
                this.updateSessionStorageContent();
            },
            methods: {
                login() {
                    axios.post('/api/users/login', this.loginForm)
                        .then(response => {
                            if (response.data.code === 200) {
                                alert('登录成功');
                                this.updateSessionStorageContent();
                            } else {
                                alert('登录失败：' + response.data.message);
                            }
                        })
                        .catch(error => {
                            alert('登录失败，请稍后重试');
                            console.error('Login error:', error);
                        });
                },
                updateSessionStorageContent() {
                    const userStr = sessionStorage.getItem('user');
                    this.sessionStorageContent = userStr || '没有找到用户信息';
                    
                    if (userStr) {
                        try {
                            const user = JSON.parse(userStr);
                            this.parsedUser = user;
                            this.parsedUserInfo = JSON.stringify(user, null, 2);
                        } catch (e) {
                            this.parsedUserInfo = '解析失败：' + e.message;
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
